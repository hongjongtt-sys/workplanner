<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f6f3;
  --surface: #ffffff;
  --surface2: #f0efe9;
  --border: #e4e2da;
  --border2: #d4d2c8;
  --accent: #2563eb;
  --accent-light: #eff6ff;
  --text: #1a1916;
  --text-muted: #6b6860;
  --text-dim: #b0aea6;
  --high: #dc2626;
  --high-bg: #fef2f2;
  --mid: #d97706;
  --mid-bg: #fffbeb;
  --low: #16a34a;
  --low-bg: #f0fdf4;
  --done: #7c3aed;
  --done-bg: #f5f3ff;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
  --radius: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Pretendard', -apple-system, sans-serif;
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
}

/* LOADING */
#loadingScreen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 999;
  gap: 16px;
}
.loading-logo {
  font-family: 'Instrument Serif', serif;
  font-size: 36px;
  color: var(--text);
}
.loading-dot {
  display: flex; gap: 6px;
}
.loading-dot span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: bounce 1.2s infinite;
}
.loading-dot span:nth-child(2) { animation-delay: 0.2s; }
.loading-dot span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%,80%,100% { transform: translateY(0); opacity: 0.4; }
  40% { transform: translateY(-8px); opacity: 1; }
}

/* HEADER */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center;
  justify-content: space-between;
  height: 58px;
  box-shadow: var(--shadow);
}
.logo {
  font-family: 'Instrument Serif', serif;
  font-size: 22px;
  color: var(--text);
  letter-spacing: -0.5px;
}
.logo em { color: var(--accent); font-style: italic; }

.header-center {
  display: flex; gap: 2px;
}
.tab {
  padding: 7px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.15s;
  white-space: nowrap;
}
.tab:hover { background: var(--surface2); color: var(--text); }
.tab.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }

.header-right { display: flex; align-items: center; gap: 10px; }

.sync-indicator {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--text-dim);
}
.sync-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--low);
}
.sync-dot.syncing { background: var(--mid); animation: pulse 1s infinite; }
.sync-dot.error { background: var(--high); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.today-label {
  font-size: 12px; color: var(--text-muted);
  background: var(--surface2);
  padding: 5px 12px; border-radius: 20px;
  border: 1px solid var(--border);
  cursor: pointer; transition: all 0.15s;
}
.today-label:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

.btn {
  padding: 8px 18px;
  font-size: 13px; font-weight: 600;
  font-family: 'Pretendard', sans-serif;
  cursor: pointer; border: none;
  border-radius: 8px;
  transition: all 0.15s;
}
.btn-primary {
  background: var(--accent);
  color: white;
}
.btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
.btn-ghost {
  background: transparent; color: var(--text-muted);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--surface2); color: var(--text); }
.btn-danger {
  background: var(--high-bg); color: var(--high);
  border: 1px solid #fecaca;
}
.btn-danger:hover { background: #fee2e2; }

/* LAYOUT */
.app { display: grid; grid-template-columns: 1fr 300px; min-height: calc(100vh - 58px); }
.content { padding: 24px; overflow-y: auto; }
.sidebar { background: var(--surface); border-left: 1px solid var(--border); padding: 20px; overflow-y: auto; }

/* VIEW PANELS */
.view { display: none; }
.view.active { display: block; }

/* PAGE HEADER */
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.page-title {
  font-family: 'Instrument Serif', serif;
  font-size: 24px; letter-spacing: -0.5px;
}

/* FILTERS */
.filters {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 16px;
}
.filter-chip {
  padding: 5px 14px;
  font-size: 12px; font-weight: 500;
  border-radius: 20px; cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  transition: all 0.15s;
  font-family: 'Pretendard', sans-serif;
}
.filter-chip:hover { border-color: var(--accent); color: var(--accent); }
.filter-chip.active {
  background: var(--accent); color: white;
  border-color: var(--accent);
}

/* TODO LIST */
.todo-list { display: flex; flex-direction: column; gap: 6px; }

.task-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: grid;
  grid-template-columns: 32px 1fr auto;
  gap: 12px;
  align-items: center;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.task-card::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px;
}
.task-card.p-HIGH::before { background: var(--high); }
.task-card.p-MID::before { background: var(--mid); }
.task-card.p-LOW::before { background: var(--low); }
.task-card.p-done::before { background: var(--done); }

.task-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-1px); }

.check-btn {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 2px solid var(--border2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; transition: all 0.15s;
  flex-shrink: 0; background: white;
}
.check-btn:hover { border-color: var(--done); }
.check-btn.checked { background: var(--done); border-color: var(--done); color: white; }

.task-body {}
.task-title {
  font-size: 14px; font-weight: 500;
  margin-bottom: 5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.task-title.done { text-decoration: line-through; color: var(--text-dim); }

.task-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.badge {
  font-size: 11px; font-weight: 600;
  padding: 2px 8px; border-radius: 6px;
  white-space: nowrap;
}
.badge-high { background: var(--high-bg); color: var(--high); }
.badge-mid { background: var(--mid-bg); color: var(--mid); }
.badge-low { background: var(--low-bg); color: var(--low); }
.badge-done { background: var(--done-bg); color: var(--done); }
.badge-cat { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
.badge-alarm { background: #fef9c3; color: #a16207; }

.deadline-text {
  font-size: 11px; color: var(--text-muted);
  display: flex; align-items: center; gap: 3px;
}
.deadline-text.overdue { color: var(--high); font-weight: 600; }
.deadline-text.near { color: var(--mid); font-weight: 600; }

/* PROGRESS RING */
.progress-ring-wrap {
  position: relative; width: 40px; height: 40px; flex-shrink: 0;
}
.progress-ring-wrap svg { transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--border); stroke-width: 3; }
.ring-fg { fill: none; stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
.ring-pct {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  font-size: 9px; font-weight: 700; color: var(--text-muted);
}

/* KANBAN */
.kanban { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
.k-col {
  background: var(--surface2);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
}
.k-col-head {
  padding: 12px 14px;
  font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface);
}
.k-col-count {
  font-size: 11px; font-weight: 700;
  background: var(--accent); color: white;
  border-radius: 10px; padding: 1px 7px;
}
.k-col-body { padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 160px; max-height: calc(100vh - 220px); overflow-y: auto; }
.k-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px; padding: 10px;
  cursor: pointer; transition: all 0.15s;
  box-shadow: var(--shadow);
}
.k-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.k-card-title { font-size: 12px; font-weight: 500; margin-bottom: 8px; line-height: 1.4; }
.k-progress {
  height: 4px; background: var(--border);
  border-radius: 2px; overflow: hidden; margin-top: 8px;
}
.k-progress-bar { height: 100%; border-radius: 2px; transition: width 0.3s; }
.k-meta { display: flex; justify-content: space-between; margin-top: 4px; font-size: 10px; color: var(--text-dim); }

/* CALENDAR */
.cal-nav { display: flex; align-items: center; gap: 12px; }
.cal-nav button {
  width: 28px; height: 28px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.cal-nav button:hover { background: var(--surface2); }
.cal-month-label { font-family: 'Instrument Serif', serif; font-size: 20px; }

.cal-scroll-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.cal-grid {
  display: grid; grid-template-columns: repeat(7,1fr);
  gap: 2px; border-radius: var(--radius); overflow: hidden;
  background: var(--border); border: 1px solid var(--border);
  margin-top: 16px;
  min-width: 770px;
}
.cal-label {
  background: var(--surface2);
  text-align: center; padding: 8px;
  font-size: 11px; font-weight: 700; color: var(--text-muted);
  letter-spacing: 0.5px;
}
.cal-label:first-child { color: var(--high); }
.cal-label:last-child { color: var(--accent); }
.cal-cell {
  background: var(--surface);
  min-height: 80px; min-width: 110px; padding: 6px;
  cursor: pointer; transition: background 0.15s;
  position: relative;
}
.cal-cell:hover { background: var(--surface2); }
.cal-cell.today { background: var(--accent-light); }
.cal-cell.today::after {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
  background: var(--accent);
}
.cal-cell.other { opacity: 0.4; }
.cal-date { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
.cal-cell.today .cal-date { color: var(--accent); }
.cal-dot {
  font-size: 9px; padding: 2px 5px;
  border-radius: 3px; margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: block;
}



/* SIDEBAR */
.sidebar-section { margin-bottom: 24px; }
.sidebar-label {
  font-size: 11px; font-weight: 700; letter-spacing: 1px;
  color: var(--text-dim); text-transform: uppercase;
  margin-bottom: 10px;
}
.stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat-box {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px; text-align: center;
}
.stat-num {
  font-family: 'Instrument Serif', serif;
  font-size: 28px; line-height: 1;
}
.stat-lbl { font-size: 10px; color: var(--text-muted); margin-top: 2px; font-weight: 500; }

.upcoming-item {
  display: flex; gap: 10px; padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.upcoming-item:last-child { border-bottom: none; }
.upcoming-stripe { width: 3px; border-radius: 2px; flex-shrink: 0; }
.upcoming-info {}
.upcoming-name { font-size: 12px; font-weight: 500; }
.upcoming-date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

.overall-bar {
  background: var(--surface2); border-radius: 4px;
  height: 8px; overflow: hidden; margin-bottom: 6px;
}
.overall-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
.overall-info { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); }

/* MODAL */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.3);
  z-index: 200; display: none;
  align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
  padding: 16px;
}
.overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: 16px;
  padding: 24px;
  width: 480px; max-width: 100%;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  animation: modalIn 0.2s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.97) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.modal-title { font-family: 'Instrument Serif', serif; font-size: 22px; }
.modal-close {
  width: 28px; height: 28px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.modal-close:hover { background: var(--high-bg); color: var(--high); }

.form-group { margin-bottom: 14px; }
.form-label {
  display: block; font-size: 11px; font-weight: 700;
  letter-spacing: 0.5px; color: var(--text-muted);
  margin-bottom: 5px; text-transform: uppercase;
}
.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 13px; color: var(--text);
  font-family: 'Pretendard', sans-serif;
  transition: border-color 0.15s;
  outline: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.slider-wrap { display: flex; align-items: center; gap: 10px; }
.slider {
  flex: 1; -webkit-appearance: none;
  height: 4px; border-radius: 2px;
  background: var(--border); outline: none; cursor: pointer;
}
.slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%; background: var(--accent); cursor: pointer;
}
.slider-val { font-size: 13px; font-weight: 700; color: var(--accent); min-width: 36px; text-align: right; }

.modal-actions { display: flex; gap: 8px; justify-content: space-between; margin-top: 4px; }
.modal-actions-right { display: flex; gap: 8px; }

/* OVERDUE BANNER */
.overdue-banner {
  background: var(--high-bg);
  border: 1px solid #fecaca;
  border-radius: 8px; padding: 10px 14px;
  font-size: 12px; color: var(--high);
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}

/* EMPTY */
.empty {
  text-align: center; padding: 48px 20px;
  color: var(--text-dim);
}
.empty-icon { font-size: 36px; margin-bottom: 10px; }
.empty p { font-size: 13px; }
.empty small { font-size: 11px; margin-top: 4px; display: block; }

/* TOAST */
.toast-wrap {
  position: fixed; bottom: 20px; right: 20px;
  z-index: 300; display: flex; flex-direction: column; gap: 6px;
}
.toast {
  background: var(--text); color: var(--bg);
  border-radius: 8px; padding: 10px 16px;
  font-size: 12px; font-weight: 500;
  box-shadow: var(--shadow-md);
  animation: toastIn 0.25s ease;
  max-width: 280px;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* MOBILE BOTTOM NAV */
.mobile-nav {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 8px 0 env(safe-area-inset-bottom);
  z-index: 100;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
}
.mobile-nav-inner { display: flex; justify-content: space-around; }
.mobile-tab {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 3px; padding: 6px 0;
  cursor: pointer; color: var(--text-dim);
  font-size: 10px; font-weight: 500; transition: color 0.15s;
}
.mobile-tab.active { color: var(--accent); }
.mobile-tab-icon { font-size: 20px; }

.mobile-fab {
  display: none;
  position: fixed; bottom: 80px; right: 20px;
  width: 52px; height: 52px;
  background: var(--accent); color: white;
  border: none; border-radius: 50%;
  font-size: 24px; cursor: pointer;
  box-shadow: 0 4px 20px rgba(37,99,235,0.4);
  z-index: 99;
  align-items: center; justify-content: center;
  transition: transform 0.15s;
}
.mobile-fab:hover { transform: scale(1.05); }

/* HABIT */
.habit-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}
.habit-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.habit-info { display: flex; align-items: center; gap: 10px; }
.habit-icon { font-size: 24px; }
.habit-name { font-size: 15px; font-weight: 600; }
.habit-note { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.habit-streak {
  display: flex; align-items: center; gap: 5px;
  font-size: 13px; font-weight: 700; color: var(--mid);
}
.habit-streak-num { font-family: 'Instrument Serif', serif; font-size: 22px; color: var(--mid); }

.habit-days {
  display: grid; grid-template-columns: repeat(7,1fr); gap: 4px;
  margin-bottom: 10px;
}
.habit-day {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.habit-day-label { font-size: 9px; color: var(--text-dim); font-weight: 600; }
.habit-day-btn {
  width: 32px; height: 32px;
  border-radius: 50%; border: 2px solid var(--border);
  background: var(--surface2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; transition: all 0.15s;
}
.habit-day-btn.checked { background: var(--low); border-color: var(--low); }
.habit-day-btn.checked::after { content: '✓'; color: white; font-size: 13px; font-weight: 700; }
.habit-day-btn.today-btn { border-color: var(--accent); }
.habit-day-btn.future { opacity: 0.3; cursor: default; }
.habit-day-btn:not(.future):hover { border-color: var(--accent); transform: scale(1.1); }

.habit-stats {
  display: flex; gap: 12px; align-items: center;
}
.habit-month-bar {
  flex: 1; background: var(--surface2);
  border-radius: 4px; height: 6px; overflow: hidden;
}
.habit-month-bar-fill { height: 100%; border-radius: 4px; background: var(--low); transition: width 0.4s; }
.habit-month-pct { font-size: 11px; font-weight: 700; color: var(--low); min-width: 36px; text-align: right; }

.habit-edit-btn {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 10px;
  font-size: 11px; color: var(--text-muted);
  cursor: pointer; transition: all 0.15s;
  font-family: 'Pretendard', sans-serif;
}
.habit-edit-btn:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

.day-check {
  display: flex; align-items: center; gap: 4px;
  font-size: 12px; cursor: pointer;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 10px;
  transition: all 0.15s;
}
.day-check:has(input:checked) { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
.day-check input { display: none; }

/* DAY POPUP */
.day-task-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  overflow: hidden;
}
.day-task-item::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
}
.day-task-item.p-HIGH::before { background: var(--high); }
.day-task-item.p-MID::before { background: var(--low); }
.day-task-item.p-LOW::before { background: var(--low); }
.day-task-item.p-done::before { background: var(--done); }
.day-task-item:hover { border-color: var(--accent); background: var(--accent-light); }
.day-task-title { font-size: 13px; font-weight: 500; }
.day-task-title.done { text-decoration: line-through; color: var(--text-dim); }
.day-empty { text-align:center; padding: 24px; color: var(--text-dim); font-size: 13px; }

/* JOURNAL */
.journal-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
}
.journal-date-label {
  padding: 10px 16px;
  font-size: 12px; font-weight: 700;
  color: var(--accent);
  background: var(--accent-light);
  border-bottom: 1px solid var(--border);
  letter-spacing: 0.5px;
}
.journal-textarea {
  width: 100%; min-height: 280px;
  padding: 16px;
  font-size: 14px; line-height: 1.8;
  color: var(--text);
  background: var(--surface);
  border: none; outline: none; resize: vertical;
  font-family: 'Pretendard', sans-serif;
}
.journal-recent-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 8px;
  cursor: pointer; transition: all 0.15s;
}
.journal-recent-item:hover { border-color: var(--accent); background: var(--accent-light); }
.journal-recent-date {
  font-size: 11px; font-weight: 700;
  color: var(--accent); min-width: 70px;
  padding-top: 1px;
}
.journal-recent-preview {
  font-size: 12px; color: var(--text-muted);
  overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; flex: 1;
}

/* CLASS */

.class-body { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.class-log-wrap {

import {
  getFirestore, collection, onSnapshot,
  addDoc, updateDoc, deleteDoc, doc, serverTimestamp, setDoc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAlTnvXABpLX96jQa7rvTYCf7HScC1pMuY",
  authDomain: "workplanner-ba44c.firebaseapp.com",
  projectId: "workplanner-ba44c",
  storageBucket: "workplanner-ba44c.firebasestorage.app",
  messagingSenderId: "494845457857",
  appId: "1:494845457857:web:252fe88d230b383c2eab40"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const COL = "tasks";

// ── State ──────────────────────────────────────────────────
window.tasks = [];
window.editId = null;
window.currentFilter = 'all';
window.calDate = new Date();

// ── Sync ───────────────────────────────────────────────────
setSyncState('syncing');
onSnapshot(collection(db, COL), (snap) => {
  window.tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  purgeOldDone();
  renderAll();
  setSyncState('ok');
  document.getElementById('loadingScreen').style.display = 'none';
}, (err) => {
  setSyncState('error');
  toast('⚠️ 동기화 오류: ' + err.message, true);
  document.getElementById('loadingScreen').style.display = 'none';
});

function setSyncState(state) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  dot.className = 'sync-dot' + (state === 'syncing' ? ' syncing' : state === 'error' ? ' error' : '');
  txt.textContent = state === 'syncing' ? '동기화 중' : state === 'error' ? '오류' : '연결됨';
}

// ── CRUD ───────────────────────────────────────────────────
window.saveTask = async function() {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) { toast('업무명을 입력하세요', true); return; }

  const data = {
    title,
    priority: document.getElementById('fPriority').value,
    category: document.getElementById('fCategory').value,
    start: document.getElementById('fStart').value,
    deadline: document.getElementById('fDeadline').value,
    status: document.getElementById('fStatus').value,
    progress: parseInt(document.getElementById('fProgress').value),
    alarm: parseInt(document.getElementById('fAlarm').value),
    assignee: document.getElementById('fAssignee').value.trim(),
    note: document.getElementById('fNote').value.trim(),
  };

  if (data.status === 'done') {
    data.progress = 100;
    if (!window.editId || (window.tasks.find(t=>t.id===window.editId)?.status !== 'done')) {
      data.doneAt = new Date().toISOString().slice(0,10);
    }
  }

  setSyncState('syncing');
  try {
    if (window.editId) {
      await updateDoc(doc(db, COL, window.editId), data);
      toast('✏️ 수정되었습니다');
    } else {
      data.createdAt = serverTimestamp();
      await addDoc(collection(db, COL), data);
      toast('✅ 업무가 추가되었습니다');
    }
    closeModal();
  } catch(e) {
    toast('저장 실패: ' + e.message, true);
    setSyncState('error');
  }
};

window.deleteTask = async function() {
  if (!window.editId) return;
  if (!confirm('정말 삭제하시겠어요?')) return;
  setSyncState('syncing');
  try {
    await deleteDoc(doc(db, COL, window.editId));
    closeModal();
    toast('🗑️ 삭제되었습니다');
  } catch(e) {
    toast('삭제 실패: ' + e.message, true);
  }
};

window.toggleDone = async function(e, id) {
  e.stopPropagation();
  const t = window.tasks.find(t => t.id === id);
  if (!t) return;
  const update = t.status === 'done'
    ? { status: 'inprogress', progress: Math.min(t.progress||0, 99), doneAt: null }
    : { status: 'done', progress: 100, doneAt: new Date().toISOString().slice(0,10) };
  setSyncState('syncing');
  try {
    await updateDoc(doc(db, COL, id), update);
    toast(update.status === 'done' ? '✅ 완료! 24시간 후 자동 숨김' : '⏳ 진행 중으로 변경');
  } catch(e) {
    toast('오류: ' + e.message, true);
  }
};

// ── Purge ──────────────────────────────────────────────────
function purgeOldDone() {
  const now = new Date();
  const today = new Date(); today.setHours(0,0,0,0);
  window.tasks.forEach(t => {
    // 완료 후 24시간 지나면 숨김
    if (t.status === 'done' && t.doneAt) {
      const diff = now - new Date(t.doneAt);
      if (diff >= 86400000) t._hidden = true;
    }
    // 마감일 다음날 00:00 지나면 숨김 (완료 아닌 것만)
    if (t.status !== 'done' && t.deadline) {
      const [y,m,d] = t.deadline.split('-').map(Number);
      const deadlineEnd = new Date(y, m-1, d+1); // 마감일 다음날 00:00 (로컬)
      if (now >= deadlineEnd) t._hidden = true;
    }
  });
}

// ── Helpers ────────────────────────────────────────────────
function prioColor(p) { return {HIGH:'var(--high)',MID:'var(--mid)',LOW:'var(--low)'}[p]||'var(--text-muted)'; }
function prioBg(p) { return {HIGH:'badge-high',MID:'badge-mid',LOW:'badge-low'}[p]||'badge-cat'; }
function prioLabel(p) { return {HIGH:'높음',MID:'중간',LOW:'낮음'}[p]||p; }
function ringColor(v) { return v>=80?'var(--low)':v>=40?'var(--mid)':'var(--accent)'; }
function isOverdue(t) {
  if (!t.deadline || t.status === 'done') return false;
  const [y,m,d] = t.deadline.split('-').map(Number);
  const deadline = new Date(y, m-1, d);
  const today = new Date(); today.setHours(0,0,0,0);
  return deadline < today;
}
function daysUntil(d) {
  const [y,m,day] = d.split('-').map(Number);
  const target = new Date(y, m-1, day);
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.ceil((target - today) / 86400000);
}

function getVisible() {
  return window.tasks.filter(t => {
    if (currentFilter === 'done') return t.status === 'done';
    if (t._hidden) return false;
    if (currentFilter === 'all') return true;
    if (currentFilter === 'ongoing') return t.status !== 'done';
    return t.priority === currentFilter;
  });
}

// ── Render ─────────────────────────────────────────────────
window.renderAll = function() {
  renderTodo(); renderKanban(); renderCalendar(); renderSidebar(); renderHabit(); checkAlarms();
};

function renderTodo() {
  const sort = document.getElementById('sortSel').value;
  let items = [...getVisible()];
  if (sort==='deadline') items.sort((a,b)=>{
    const da = a.deadline || a.start || '9999';
    const db = b.deadline || b.start || '9999';
    return da < db ? -1 : 1;
  });
  else if (sort==='priority') items.sort((a,b)=>['HIGH','MID','LOW'].indexOf(a.priority)-['HIGH','MID','LOW'].indexOf(b.priority));
  else if (sort==='progress') items.sort((a,b)=>b.progress-a.progress);

  const overdue = window.tasks.filter(t=>isOverdue(t)&&!t._hidden);
  document.getElementById('overdueBanner').innerHTML = overdue.length
    ? `<div class="overdue-banner">⚠️ 마감 기한이 지난 업무 ${overdue.length}개가 있습니다</div>` : '';

  if (!items.length) {
    document.getElementById('todoList').innerHTML =
      `<div class="empty"><div class="empty-icon">📭</div><p>업무가 없습니다</p><small>+ 업무 추가 버튼으로 시작하세요</small></div>`;
    return;
  }

  document.getElementById('todoList').innerHTML = items.map(t => {
    const R=14, C=2*Math.PI*R, off=C-(t.progress/100)*C;
    const done = t.status==='done';
    const due = t.deadline ? daysUntil(t.deadline) : null;
    const dueText = due!==null ? (due<0?`${Math.abs(due)}일 초과`:due===0?'오늘 마감':`D-${due}`) : '';
    const dueClass = due!==null&&due<0?'overdue':due!==null&&due<=2?'near':'';
    return `
    <div class="task-card ${done?'p-done':'p-'+t.priority}" onclick="editTask('${t.id}')">
      <div class="check-btn ${done?'checked':''}" onclick="toggleDone(event,'${t.id}')">${done?'✓':''}</div>
      <div class="task-body">
        <div class="task-title ${done?'done':''}">${t.title}</div>
        <div class="task-meta">
          <span class="badge ${prioBg(t.priority)}">${prioLabel(t.priority)}</span>
          <span class="badge badge-cat">${t.category}</span>
          ${t.assignee?`<span class="badge badge-cat">👤 ${t.assignee}</span>`:''}
          ${t.alarm>0?`<span class="badge badge-alarm">🔔 ${t.alarm}일 전</span>`:''}
          ${dueText?`<span class="deadline-text ${dueClass}">📅 ${dueText}</span>`:''}
          ${t.note?`<span style="font-size:11px;color:var(--text-dim)">💬 ${t.note}</span>`:''}
        </div>
      </div>
      <div class="progress-ring-wrap">
        <svg width="40" height="40" viewBox="0 0 36 36">
          <circle class="ring-bg" cx="18" cy="18" r="${R}"/>
          <circle class="ring-fg" cx="18" cy="18" r="${R}"
            stroke="${ringColor(t.progress)}"
            stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
        </svg>
        <div class="ring-pct">${t.progress}%</div>
      </div>
    </div>`;
  }).join('');
}

function renderKanban() {

function renderCalendar() {
  const y = window.calDate.getFullYear(), m = window.calDate.getMonth();
  document.getElementById('calMonthLabel').textContent = `${y}년 ${m+1}월`;
  const first = new Date(y,m,1), last = new Date(y,m+1,0);
  const today = new Date().toISOString().slice(0,10);
  const map = {};
  window.tasks.forEach(t=>{
    const start = t.start || t.deadline || null;
    const end = t.deadline || t.start || null;
    if(!start) return;
    for(let d=new Date(start); d<=new Date(end); d.setDate(d.getDate()+1)){
      const key = d.toISOString().slice(0,10);
      (map[key] = map[key]||[]).push(t);
    }
  });
  const days=['일','월','화','수','목','금','토'];
  let html = days.map(d=>`<div class="cal-label">${d}</div>`).join('');
  const prevLast = new Date(y,m,0).getDate();
  for(let i=first.getDay()-1;i>=0;i--) html+=`<div class="cal-cell other"><div class="cal-date">${prevLast-i}</div></div>`;
  for(let d=1;d<=last.getDate();d++){
    const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=key===today, dayTasks=map[key]||[];
    html+=`<div class="cal-cell ${isToday?'today':''}" onclick="openDayPopup('${key}')">
      <div class="cal-date">${d}</div>
      ${dayTasks.map(t=>{
        const s = t.start || t.deadline;
        const e = t.deadline || t.start;
        const isOneDay = s === e;
        const isStart = s === key;
        const isEnd = e === key;
        const marker = isOneDay ? '● ' : isStart ? '▶ ' : isEnd ? '⏹ ' : '▬ ';
        return `<div class="cal-dot" style="background:${prioColor(t.priority)}18;color:${prioColor(t.priority)}">${marker}${t.title}</div>`;
      }).join('')}
      ${window.journals && window.journals[key] ? `<div class="cal-dot" style="background:#fef9c3;color:#a16207">📓 일지</div>` : ''}
    </div>`;
  }
  const rem = (first.getDay()+last.getDate())%7; if(rem>0) for(let d=1;d<=7-rem;d++) html+=`<div class="cal-cell other"><div class="cal-date">${d}</div></div>`;
  document.getElementById('calGrid').innerHTML = html;
}



function renderSidebar() {
  const total=window.tasks.length, done=window.tasks.filter(t=>t.status==='done').length;
  const ongoing=window.tasks.filter(t=>t.status==='inprogress').length;
  const overdue=window.tasks.filter(t=>isOverdue(t)).length;
  document.getElementById('statsRow').innerHTML=`
    <div class="stat-box"><div class="stat-num" style="color:var(--accent)">${total}</div><div class="stat-lbl">전체</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--low)">${done}</div><div class="stat-lbl">완료</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--accent)">${ongoing}</div><div class="stat-lbl">진행 중</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--high)">${overdue}</div><div class="stat-lbl">마감 초과</div></div>`;

  const avg=total?Math.round(window.tasks.reduce((s,t)=>s+t.progress,0)/total):0;
  document.getElementById('overallWrap').innerHTML=`
    <div class="overall-bar"><div class="overall-bar-fill" style="width:${avg}%;background:${ringColor(avg)}"></div></div>
    <div class="overall-info"><span>${done}/${total} 완료</span><span style="font-weight:700;color:${ringColor(avg)}">${avg}%</span></div>`;

  const upcoming=window.tasks.filter(t=>t.deadline&&t.status!=='done'&&daysUntil(t.deadline)<=5)
    .sort((a,b)=>a.deadline<b.deadline?-1:1).slice(0,5);
  document.getElementById('upcomingWrap').innerHTML=upcoming.length?upcoming.map(t=>{
    const d=daysUntil(t.deadline);
    const txt=d<0?`${Math.abs(d)}일 초과`:d===0?'오늘':`D-${d}`;
    const clr=d<=0?'var(--high)':d<=2?'var(--mid)':prioColor(t.priority);
    return `<div class="upcoming-item">
      <div class="upcoming-stripe" style="background:${clr}"></div>
      <div class="upcoming-info">
        <div class="upcoming-name">${t.title}</div>
        <div class="upcoming-date" style="color:${d<=0?'var(--high)':'var(--text-muted)'}">${txt} · ${t.deadline}</div>
      </div>
    </div>`;
  }).join(''):`<div style="font-size:12px;color:var(--text-dim);padding:8px 0">임박한 마감일 없음</div>`;
}

// ── Alarms ─────────────────────────────────────────────────
function checkAlarms() {
  window.tasks.forEach(t=>{
    if(!t.deadline||!t.alarm||t.status==='done') return;
    const diff = daysUntil(t.deadline);
    if(diff===parseInt(t.alarm)){
      const key=`alarm_${t.id}_${t.deadline}`;
      if(!sessionStorage.getItem(key)){
        sessionStorage.setItem(key,'1');
        toast(`🔔 "${t.title}" 마감 ${t.alarm}일 전입니다!`, false, 5000);
      }
    }
  });
}

// ── Day Popup ──────────────────────────────────────────────
window._selectedDay = null;

window.openDayPopup = function(dateStr) {
  window._selectedDay = dateStr;
  const [y,m,d] = dateStr.split('-').map(Number);
  const dayLabels = ['일','월','화','수','목','금','토'];
  const dt = new Date(y,m-1,d);
  const label = `${m}월 ${d}일 (${dayLabels[dt.getDay()]})`;
  document.getElementById('dayPopupTitle').textContent = label;

  // 해당 날짜에 걸쳐있는 업무 필터
  const dayTasks = window.tasks.filter(t => {
    const start = t.start || t.deadline || null;
    const end = t.deadline || t.start || null;
    if (!start) return false;
    return dateStr >= start && dateStr <= end;
  }).sort((a,b) => {
    const da = a.deadline || a.start || '9999';
    const db = b.deadline || b.start || '9999';
    return da < db ? -1 : 1;
  });

  if (!dayTasks.length) {
    document.getElementById('dayPopupList').innerHTML =
      `<div class="day-empty">📭 이 날 등록된 업무가 없습니다</div>`;
  } else {
    document.getElementById('dayPopupList').innerHTML = dayTasks.map(t => `
      <div class="day-task-item ${t.status==='done'?'p-done':'p-'+t.priority}" onclick="openTaskFromDay('${t.id}')">
        <div style="flex:1">
          <div class="day-task-title ${t.status==='done'?'done':''}">${t.title}</div>
          <div style="display:flex;gap:5px;margin-top:4px;flex-wrap:wrap">
            <span class="badge ${prioBg(t.priority)}">${prioLabel(t.priority)}</span>
            <span class="badge badge-cat">${t.category}</span>
            ${t.deadline ? `<span class="badge badge-cat">📅 ${t.deadline}</span>` : ''}
            ${t.status==='done' ? `<span class="badge badge-done">완료</span>` : ''}
          </div>
          ${t.note ? `<div style="font-size:11px;color:var(--text-dim);margin-top:4px">💬 ${t.note}</div>` : ''}
        </div>
        <div style="flex-shrink:0;font-size:12px;font-weight:700;color:${ringColor(t.progress)}">${t.progress}%</div>
      </div>`).join('');
  }

  // 일지 미리보기
  const journalData = window.journals && window.journals[dateStr];
  const journalPreviewEl = document.getElementById('dayJournalPreview');
  if (journalData) {
    const preview = journalData.content.slice(0,120).replace(/\n/g,'<br>') + (journalData.content.length>120?'...':'');
    journalPreviewEl.innerHTML = `
      <div style="margin-top:12px;padding:10px 12px;background:#fef9c3;border:1px solid #fde68a;border-radius:8px;cursor:pointer" onclick="openJournalFromDay('${dateStr}')">
        <div style="font-size:10px;font-weight:700;color:#a16207;margin-bottom:4px">📓 일지</div>
        <div style="font-size:12px;color:#78350f;line-height:1.6">${preview}</div>
      </div>`;
    document.getElementById('dayJournalBtn').textContent = '📓 일지 편집';
  } else {
    journalPreviewEl.innerHTML = '';
    document.getElementById('dayJournalBtn').textContent = '📓 일지 작성';
  }

  document.getElementById('dayOverlay').classList.add('open');
};

window.closeDayOutside = function(e) { if(e.target===document.getElementById('dayOverlay')) closeDayPopup(); };

// ── HABIT ──────────────────────────────────────────────────
const HABIT_COL = "habits";
const HABIT_CHECK_COL = "habitChecks";
window.habits = [];
window.habitChecks = {}; // { "habitId_YYYY-MM-DD": true }
window.editHabitId = null;

// 습관 실시간 동기화
onSnapshot(collection(db, HABIT_COL), snap => {
  window.habits = snap.docs.map(d=>({id:d.id,...d.data()}));
  renderHabit();
});
onSnapshot(collection(db, HABIT_CHECK_COL), snap => {
  window.habitChecks = {};
  snap.docs.forEach(d=>{ window.habitChecks[d.id] = true; });
  renderHabit();
});

function getTodayStr() {
  const n=new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}

function getLast7Days() {
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    days.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
  }
  return days;
}

function getMonthDays() {
  const n=new Date(), y=n.getFullYear(), m=n.getMonth();
  const last=new Date(y,m+1,0).getDate();
  const days=[];
  for(let d=1;d<=last;d++){
    days.push(`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  }
  return days;
}

function calcStreak(habitId) {
  let streak=0;
  const d=new Date();
  while(true){
    const key=`${habitId}_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(window.habitChecks[key]) streak++;
    else break;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

function calcMonthRate(habitId) {
  const days=getMonthDays();
  const today=getTodayStr();
  const past=days.filter(d=>d<=today);
  if(!past.length) return 0;
  const done=past.filter(d=>window.habitChecks[`${habitId}_${d}`]).length;
  return Math.round(done/past.length*100);
}

window.toggleHabitCheck = async function(habitId, dateStr, btn) {
  const key=`${habitId}_${dateStr}`;
  const today=getTodayStr();
  if(dateStr>today) return; // 미래는 체크 불가
  try {
    if(window.habitChecks[key]){
      await deleteDoc(doc(db, HABIT_CHECK_COL, key));
    } else {
      await setDoc(doc(db, HABIT_CHECK_COL, key), {habitId, date:dateStr});
    }
  } catch(e){ toast('오류: '+e.message, true); }
};

function renderHabit() {
  const el=document.getElementById('habitList');
  if(!el) return;
  if(!window.habits.length){
    el.innerHTML=`<div class="empty"><div class="empty-icon">🔥</div><p>습관이 없습니다</p><small>+ 습관 추가 버튼으로 시작하세요</small></div>`;
    return;
  }
  const last7=getLast7Days();
  const today=getTodayStr();
  const dayLabels=['일','월','화','수','목','금','토'];
  el.innerHTML=window.habits.map(h=>{
    const streak=calcStreak(h.id);
    const monthRate=calcMonthRate(h.id);
    const daysHtml=last7.map(dateStr=>{
      const d=new Date(dateStr+'T00:00:00');
      const label=dayLabels[d.getDay()];
      const checked=!!window.habitChecks[`${h.id}_${dateStr}`];
      const isToday=dateStr===today;
      const isFuture=dateStr>today;
      return `<div class="habit-day">
        <div class="habit-day-label" style="${isToday?'color:var(--accent);font-weight:700':''}">${label}</div>
        <div class="habit-day-btn ${checked?'checked':''} ${isToday?'today-btn':''} ${isFuture?'future':''}"
          onclick="toggleHabitCheck('${h.id}','${dateStr}',this)"></div>
        <div style="font-size:8px;color:var(--text-dim)">${dateStr.slice(8)}</div>
      </div>`;
    }).join('');
    return `<div class="habit-card">
      <div class="habit-head">
        <div class="habit-info">
          <div class="habit-icon">${h.icon||'✅'}</div>
          <div>
            <div class="habit-name">${h.name}</div>
            ${h.note?`<div class="habit-note">${h.note}</div>`:''}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="habit-streak">
            <span class="habit-streak-num">${streak}</span>
            <span>🔥</span>
          </div>
          <button class="habit-edit-btn" onclick="openHabitModal('${h.id}')">편집</button>
        </div>
      </div>
      <div class="habit-days">${daysHtml}</div>
      <div class="habit-stats">
        <span style="font-size:11px;color:var(--text-muted)">이번 달</span>
        <div class="habit-month-bar"><div class="habit-month-bar-fill" style="width:${monthRate}%"></div></div>
        <span class="habit-month-pct">${monthRate}%</span>
      </div>
    </div>`;
  }).join('');
}

window.openHabitModal = function(id=null) {
  window.editHabitId = id;
  document.getElementById('habitModalTitle').textContent = id ? '습관 편집' : '새 습관';
  document.getElementById('hDeleteBtn').style.display = id ? 'block' : 'none';
  if(id) {
    const h=window.habits.find(h=>h.id===id);
    if(!h) return;
    document.getElementById('hName').value=h.name;
    document.getElementById('hIcon').value=h.icon||'';
    document.getElementById('hFreq').value=h.freq||'daily';
    document.getElementById('hNote').value=h.note||'';
    const custom=h.freq==='custom'&&h.days;
    document.getElementById('hCustomDays').style.display=custom?'block':'none';
    if(custom) document.querySelectorAll('#hCustomDays input').forEach(cb=>{ cb.checked=h.days.includes(parseInt(cb.value)); });
  } else {
    document.getElementById('hName').value='';
    document.getElementById('hIcon').value='';
    document.getElementById('hFreq').value='daily';
    document.getElementById('hNote').value='';
    document.getElementById('hCustomDays').style.display='none';
  }
  document.getElementById('habitOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('hName').focus(),100);
};

document.getElementById('hFreq').addEventListener('change', function(){
  document.getElementById('hCustomDays').style.display=this.value==='custom'?'block':'none';
});

window.closeHabitModal = function(){ document.getElementById('habitOverlay').classList.remove('open'); };
window.closeHabitOutside = function(e){ if(e.target===document.getElementById('habitOverlay')) closeHabitModal(); };

window.saveHabit = async function() {
  const name=document.getElementById('hName').value.trim();
  if(!name){ toast('습관 이름을 입력하세요',true); return; }
  const freq=document.getElementById('hFreq').value;
  const data={
    name,
    icon: document.getElementById('hIcon').value.trim()||'✅',
    freq,
    days: freq==='custom' ? Array.from(document.querySelectorAll('#hCustomDays input:checked')).map(c=>parseInt(c.value)) : [],
    note: document.getElementById('hNote').value.trim(),
  };
  try {
    if(window.editHabitId){
      await updateDoc(doc(db, HABIT_COL, window.editHabitId), data);
      toast('✏️ 습관이 수정되었습니다');
    } else {
      await addDoc(collection(db, HABIT_COL), data);
      toast('✅ 습관이 추가되었습니다');
    }
    closeHabitModal();
  } catch(e){ toast('저장 실패: '+e.message, true); }
};

window.deleteHabit = async function() {
  if(!window.editHabitId) return;
  if(!confirm('습관을 삭제할까요? 체크 기록도 모두 삭제됩니다.')) return;
  try {
    await deleteDoc(doc(db, HABIT_COL, window.editHabitId));
    closeHabitModal();
    toast('🗑️ 삭제되었습니다');
  } catch(e){ toast('삭제 실패: '+e.message, true); }
};

// ── JOURNAL ────────────────────────────────────────────────
const JOURNAL_COL = "journals";
window.journals = {}; // { "YYYY-MM-DD": { content, updatedAt } }
window.journalCurrentDate = getTodayStr();
let journalSaveTimer = null;

// 일지 실시간 동기화
onSnapshot(collection(db, JOURNAL_COL), snap => {
  window.journals = {};
  snap.docs.forEach(d => { window.journals[d.id] = d.data(); });
  renderCalendar(); // 캘린더에 📓 표시 업데이트
  renderJournalRecent();
});

function initJournal() {
  window.journalCurrentDate = getTodayStr();
  document.getElementById('journalDatePicker').value = window.journalCurrentDate;
  loadJournal(window.journalCurrentDate);
}

window.loadJournal = function(dateStr) {
  window.journalCurrentDate = dateStr;
  const [y,m,d] = dateStr.split('-').map(Number);
  const dayLabels=['일','월','화','수','목','금','토'];
  const dt = new Date(y,m-1,d);
  document.getElementById('journalDateLabel').textContent =
    `${y}년 ${m}월 ${d}일 (${dayLabels[dt.getDay()]})`;
  const existing = window.journals[dateStr];
  document.getElementById('journalContent').value = existing ? existing.content : '';
  document.getElementById('journalSaveStatus').textContent = existing ? '✓ 저장됨' : '';
  document.getElementById('journalDatePicker').value = dateStr;
  // 내용 있을 때만 삭제 버튼 표시
  const deleteBtn = document.getElementById('journalDeleteBtn');
  if (deleteBtn) deleteBtn.style.display = existing ? 'block' : 'none';
};

// 자동 저장 (타이핑 멈춘 후 1.5초)
document.getElementById('journalContent').addEventListener('input', function() {
  document.getElementById('journalSaveStatus').textContent = '저장 중...';
  clearTimeout(journalSaveTimer);
  journalSaveTimer = setTimeout(() => saveJournal(), 1500);
});

async function saveJournal() {
  const content = document.getElementById('journalContent').value;
  const dateStr = window.journalCurrentDate;
  if (!content.trim()) {
    // 내용 비우면 삭제
    try {
      await deleteDoc(doc(db, JOURNAL_COL, dateStr));
      document.getElementById('journalSaveStatus').textContent = '';
    } catch(e) {}
    return;
  }
  try {
    await setDoc(doc(db, JOURNAL_COL, dateStr), {
      content,
      updatedAt: new Date().toISOString()
    });
    document.getElementById('journalSaveStatus').textContent = '✓ 저장됨';
    const deleteBtn = document.getElementById('journalDeleteBtn');
    if (deleteBtn) deleteBtn.style.display = 'block';
  } catch(e) {
    document.getElementById('journalSaveStatus').textContent = '저장 실패';
  }
}

function renderJournalRecent() {
  const el = document.getElementById('journalRecentList');
  if (!el) return;
  const entries = Object.entries(window.journals)
    .sort((a,b) => b[0] < a[0] ? -1 : 1)
    .slice(0, 10);
  if (!entries.length) {
    el.innerHTML = `<div style="font-size:12px;color:var(--text-dim);padding:8px 0">아직 작성된 일지가 없습니다</div>`;
    return;
  }
  el.innerHTML = entries.map(([dateStr, data]) => {
    const [y,m,d] = dateStr.split('-').map(Number);
    const dayLabels=['일','월','화','수','목','금','토'];
    const dt = new Date(y,m-1,d);
    const preview = data.content.replace(/\n/g,' · ').slice(0,60) + (data.content.length>60?'...':'');
    return `<div class="journal-recent-item" onclick="loadJournal('${dateStr}');document.getElementById('journalDatePicker').value='${dateStr}'">
      <div class="journal-recent-date">${m}/${d} (${dayLabels[dt.getDay()]})</div>
      <div class="journal-recent-preview">${preview}</div>
    </div>`;
  }).join('');
}

window.moveJournal = async function() {
  const content = document.getElementById('journalContent').value.trim();
  if (!content) { toast('이동할 일지 내용이 없습니다', true); return; }
  const newDate = prompt('이동할 날짜를 입력하세요 (예: 2026-06-04)', window.journalCurrentDate);
  if (!newDate || !/^\d{4}-\d{2}-\d{2}$/.test(newDate)) {
    toast('올바른 날짜 형식이 아닙니다', true); return;
  }
  if (newDate === window.journalCurrentDate) {
    toast('같은 날짜입니다', true); return;
  }
  if (window.journals[newDate]) {
    if (!confirm(`${newDate}에 이미 일지가 있습니다. 덮어쓸까요?`)) return;
  }
  try {
    // 새 날짜에 저장
    await setDoc(doc(db, JOURNAL_COL, newDate), { content, updatedAt: new Date().toISOString() });
    // 기존 날짜 삭제
    await deleteDoc(doc(db, JOURNAL_COL, window.journalCurrentDate));
    toast(`📅 ${newDate}로 이동했습니다`);
    loadJournal(newDate);
    document.getElementById('journalDatePicker').value = newDate;
  } catch(e) { toast('이동 실패: ' + e.message, true); }
};

window.deleteJournal = async function() {
  if (!window.journals[window.journalCurrentDate]) return;
  if (!confirm('이 날의 일지를 삭제할까요?')) return;
  try {
    await deleteDoc(doc(db, JOURNAL_COL, window.journalCurrentDate));
    document.getElementById('journalContent').value = '';
    document.getElementById('journalSaveStatus').textContent = '';
    document.getElementById('journalDeleteBtn').style.display = 'none';
    toast('🗑️ 일지가 삭제되었습니다');
  } catch(e) { toast('삭제 실패: ' + e.message, true); }
};
window.openJournalFromDay = function(dateStr) {
  closeDayPopup();
  setTimeout(() => {
    switchTab('journal');
    loadJournal(dateStr);
    document.getElementById('journalDatePicker').value = dateStr;
  }, 150);
};

// ── CLASS ──────────────────────────────────────────────────
const CLASS_COL = "classes";       // 반 목록
const CLASS_LOG_COL = "classLogs"; // 진도 기록
const CLASS_MEMO_COL = "classMemos"; // 수업 메모

window.classRooms = [];   // [{id, name}]
window.classLogs = [];    // [{id, classId, date, unit, page}]
window.classMemos = {};   // { classId: content }
window.currentClassId = null;
let classMemoTimer = {};

// 실시간 동기화
onSnapshot(collection(db, CLASS_COL), snap => {
  window.classRooms = snap.docs.map(d=>({id:d.id,...d.data()}))
    .sort((a,b)=>a.order-b.order||a.name.localeCompare(b.name));
  if(!window.currentClassId && window.classRooms.length)
    window.currentClassId = window.classRooms[0].id;
  renderClass();
});
onSnapshot(collection(db, CLASS_LOG_COL), snap => {
  window.classLogs = snap.docs.map(d=>({id:d.id,...d.data()}));
  renderClass();
});
onSnapshot(collection(db, CLASS_MEMO_COL), snap => {
  window.classMemos = {};
  snap.docs.forEach(d=>{ window.classMemos[d.id] = d.data().content||''; });
  renderClass();
});

function initClass() { renderClass(); }

function renderClass() {
  const tabsEl = document.getElementById('classTabs');
  const contentEl = document.getElementById('classContent');
  if(!tabsEl||!contentEl) return;

  if(!window.classRooms.length) {
    tabsEl.innerHTML = '';
    contentEl.innerHTML = `<div class="empty"><div class="empty-icon">📚</div><p>반이 없습니다</p><small>⚙️ 반 설정 버튼으로 반을 추가하세요</small></div>`;
    return;
  }

  // 반 탭
  tabsEl.innerHTML = window.classRooms.map(c=>`
    <button class="class-tab-btn ${c.id===window.currentClassId?'active':''}"
      onclick="selectClass('${c.id}')">${c.name}</button>
  `).join('');

  if(!window.currentClassId) return;
  const cls = window.classRooms.find(c=>c.id===window.currentClassId);
  if(!cls) return;

  // 해당 반 진도 기록
  const logs = window.classLogs
    .filter(l=>l.classId===window.currentClassId)
    .sort((a,b)=>b.date<a.date?-1:1);

  const memo = window.classMemos[window.currentClassId]||'';

  contentEl.innerHTML = `
    <div class="class-body">
      <!-- 수업 메모 -->
      <div class="class-memo-wrap">
        <div class="class-memo-head">📝 ${cls.name} 수업 메모</div>
        <textarea class="class-memo-textarea" id="classMemo_${cls.id}"
          placeholder="수업 관련 메모, 특이사항, 숙제 등..."
          oninput="autoSaveClassMemo('${cls.id}')">${memo}</textarea>
        <div style="padding:4px 14px 8px;font-size:10px;color:var(--text-dim)" id="memoStatus_${cls.id}"></div>
      </div>

      <!-- 진도 기록 -->
      <div class="class-log-wrap">
        <div class="class-log-head">
          <span>📖 진도 기록</span>
          <span style="font-size:10px;color:var(--text-muted)">총 ${logs.length}차시</span>
        </div>
        <div class="class-add-form">
          <input type="date" class="form-input" id="logDate_${cls.id}" style="padding:6px 8px;font-size:12px" value="${getTodayStr()}">
          <input type="text" class="form-input" id="logUnit_${cls.id}" style="padding:6px 8px;font-size:12px" placeholder="단원명 (예: 3단원 이차방정식)">
          <input type="text" class="form-input" id="logPage_${cls.id}" style="padding:6px 8px;font-size:12px" placeholder="쪽수/범위">
          <button class="btn btn-primary" style="padding:6px 12px;font-size:12px;white-space:nowrap" onclick="addClassLog('${cls.id}')">추가</button>
        </div>
        <div class="class-log-list">
          ${logs.length ? logs.map(l=>`
            <div class="class-log-item">
              <div class="class-log-date">${l.date}</div>
              <div class="class-log-unit">${l.unit}</div>
              <div class="class-log-page">${l.page||''}</div>
              <button class="class-log-del" onclick="deleteClassLog('${l.id}')">✕</button>
            </div>`).join('') :
            `<div style="text-align:center;padding:20px;color:var(--text-dim);font-size:12px">진도 기록이 없습니다</div>`
          }
        </div>
      </div>
    </div>`;
}

window.selectClass = function(id) {
  window.currentClassId = id;
  renderClass();
};

window.autoSaveClassMemo = function(classId) {
  const status = document.getElementById(`memoStatus_${classId}`);
  if(status) status.textContent = '저장 중...';
  clearTimeout(classMemoTimer[classId]);
  classMemoTimer[classId] = setTimeout(async ()=>{
    const content = document.getElementById(`classMemo_${classId}`)?.value||'';
    try {
      await setDoc(doc(db, CLASS_MEMO_COL, classId), { content });
      if(status) status.textContent = '✓ 저장됨';
    } catch(e) { if(status) status.textContent = '저장 실패'; }
  }, 1500);
};

window.addClassLog = async function(classId) {
  const date = document.getElementById(`logDate_${classId}`).value;
  const unit = document.getElementById(`logUnit_${classId}`).value.trim();
  const page = document.getElementById(`logPage_${classId}`).value.trim();
  if(!date||!unit) { toast('날짜와 단원명을 입력하세요', true); return; }
  try {
    await addDoc(collection(db, CLASS_LOG_COL), { classId, date, unit, page, createdAt: serverTimestamp() });
    document.getElementById(`logUnit_${classId}`).value='';
    document.getElementById(`logPage_${classId}`).value='';
    toast('✅ 진도가 기록되었습니다');
  } catch(e) { toast('저장 실패: '+e.message, true); }
};

window.deleteClassLog = async function(id) {
  if(!confirm('이 진도 기록을 삭제할까요?')) return;
  try {
    await deleteDoc(doc(db, CLASS_LOG_COL, id));
    toast('🗑️ 삭제되었습니다');
  } catch(e) { toast('삭제 실패: '+e.message, true); }
};

window.openClassSetup = function() {
  const current = window.classRooms.map(c=>c.name).join('\n');
  const input = prompt(
    '반 이름을 한 줄에 하나씩 입력하세요\n(예: 1-1\n1-2\n2-3)',
    current
  );
  if(input===null) return;
  const names = input.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!names.length) { toast('반 이름을 입력하세요', true); return; }
  saveClassRooms(names);
};

async function saveClassRooms(names) {
  try {
    // 기존 반 삭제
    for(const c of window.classRooms) {
      await deleteDoc(doc(db, CLASS_COL, c.id));
    }
    // 새 반 추가
    for(let i=0;i<names.length;i++) {
      await addDoc(collection(db, CLASS_COL), { name: names[i], order: i });
    }
    toast('✅ 반 설정이 저장되었습니다');
  } catch(e) { toast('저장 실패: '+e.message, true); }
}

// ── Keyboard ───────────────────────────────────────────────
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') { closeModal(); closeDayPopup(); closeHabitModal(); }
  if(e.key==='n'&&!e.target.matches('input,textarea,select')) openModal();
});
